<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Notion 메모</title>
<style>
  :root {
    --bg: #12151c; --fg: #e8edf5; --muted: #9aa7b8; --line: #2a3242; --accent: #4f8cff;
    --fs: 14px; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  #card {
    height:100%; display:flex; flex-direction:column;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: var(--radius);
    overflow:hidden;
  }
  header {
    -webkit-app-region: drag; user-select:none;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border-bottom:1px solid var(--line);
    font-size: calc(var(--fs) - 1px); color: var(--muted);
  }
  header .title { font-weight:600; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .btns { -webkit-app-region: no-drag; display:flex; gap:4px; }
  header button {
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    font-size:13px; padding:2px 5px; border-radius:6px;
  }
  header button:hover { background: rgba(255,255,255,.08); color:var(--fg); }
  main { flex:1; overflow-y:auto; padding:10px 12px; font-size: var(--fs); line-height:1.55; }
  main::-webkit-scrollbar { width:7px; }
  main::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  .item { margin:3px 0; white-space:pre-wrap; word-break:break-word; }
  .indent { padding-left:14px; }
  .h1 { font-size:1.22em; font-weight:700; margin:10px 0 4px; }
  .h2 { font-size:1.12em; font-weight:700; margin:9px 0 3px; }
  .h3 { font-size:1.04em; font-weight:600; margin:8px 0 3px; }
  .bullet::before { content:"• "; color:var(--accent); }
  .number::before { content:"– "; color:var(--accent); }
  .quote { border-left:3px solid var(--accent); padding-left:8px; color:var(--muted); }
  .callout { background:rgba(255,255,255,.06); border-radius:8px; padding:6px 8px; }
  .code { font-family: ui-monospace, Consolas, monospace; background:rgba(0,0,0,.35);
          border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:.92em; }
  .divider { border-top:1px solid var(--line); margin:8px 0; height:0; }
  .todo { display:flex; gap:7px; align-items:flex-start; }
  .todo .box { flex:none; margin-top:.18em; }
  .todo.done span.txt { color:var(--muted); text-decoration:line-through; }
  .toggle::before { content:"▸ "; color:var(--muted); }
  footer { padding:5px 10px; border-top:1px solid var(--line); font-size:11px; color:var(--muted);
           display:flex; justify-content:space-between; }
  .err { color:#ff6b7a; }
  /* 테마 */
  body.light #card { --bg:#ffffff; --fg:#1d232e; --muted:#69758a; --line:#e2e7ef; }
  body.glass #card { background: rgba(18,21,28,.55); backdrop-filter: blur(14px); }
</style>
</head>
<body>
  <div id="card">
    <header>
      <span class="title" id="title">Notion 메모</span>
      <span class="btns">
        <button id="refresh" title="새로고침">⟳</button>
        <button id="settings" title="설정">⚙</button>
      </span>
    </header>
    <main id="content"><div class="item" style="color:var(--muted)">불러오는 중…</div></main>
    <footer><span id="status">-</span><span id="time"></span></footer>
  </div>
<script src="./widget.js"></script>
</body>
</html>
